name: Sync and Compile fakeipfilter-!cn Rules

on:
  schedule:
    - cron: '0 18 1 * *'  # 每天北京时间02:00执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fakeipfilter_not_cn_rules:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install mihomo
        run: |
          set -euo pipefail

          base="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha"
          version="$(curl -fsSL --retry 3 "$base/version.txt" | tr -d '\r\n')"
          test -n "$version"

          curl -fsSL --retry 3 \
            "$base/mihomo-linux-amd64-${version}.gz" \
            -o "$RUNNER_TEMP/mihomo.gz"

          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          sudo install -m 0755 "$RUNNER_TEMP/mihomo" /usr/local/bin/mihomo

          mihomo -v

      - name: Fetch fakeipfilter-!cn Rules
        run: |
          set -euo pipefail

          mkdir -p rules/Domain

          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/Rcftngqmgq/ClashRules/refs/heads/main/rules/Domain/fakeipfilter-!cn.list' \
            -o 'rules/Domain/fakeipfilter-!cn.list'

          test -s 'rules/Domain/fakeipfilter-!cn.list'

      - name: Convert fakeipfilter-!cn Rules to YAML
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path("rules/Domain/fakeipfilter-!cn.list")
          target = Path("rules/Domain/fakeipfilter-!cn.yaml")

          rules = []
          seen = set()

          for line in source.read_text(encoding="utf-8-sig").splitlines():
              # 清理注释和空白，不修改源 list。
              rule = line.split("#", 1)[0].strip().lower()

              # 保留原有通配符，按首次出现的顺序去重。
              if rule and rule not in seen:
                  seen.add(rule)
                  rules.append(rule)

          if not rules:
              raise SystemExit("错误：没有有效规则，停止生成")

          payload = [
              "  - '" + rule.replace("'", "''") + "'"
              for rule in rules
          ]

          target.write_text(
              "payload:\n" + "\n".join(payload) + "\n",
              encoding="utf-8",
          )

          print(f"已按源文件顺序生成 YAML，共 {len(rules)} 条规则")
          PY

      - name: Convert fakeipfilter-!cn Rules to MRS
        run: |
          set -euo pipefail

          mihomo convert-ruleset domain yaml \
            'rules/Domain/fakeipfilter-!cn.yaml' \
            "$RUNNER_TEMP/fakeipfilter-!cn.mrs"

          test -s "$RUNNER_TEMP/fakeipfilter-!cn.mrs"

          cp "$RUNNER_TEMP/fakeipfilter-!cn.mrs" \
            'rules/Domain/fakeipfilter-!cn.mrs'

      - name: Commit and Push Changes
        run: |
          set -euo pipefail

          git add -- \
            'rules/Domain/fakeipfilter-!cn.list' \
            'rules/Domain/fakeipfilter-!cn.yaml' \
            'rules/Domain/fakeipfilter-!cn.mrs'

          if git diff --cached --quiet; then
            echo "文件没有变化，无需提交"
            exit 0
          fi

          git commit -m 'Update fakeipfilter-!cn rules (list -> yaml -> mrs)'
          git pull --rebase
          git push
