name: Sync and Compile fakeipfilter-cn Rules

on:
  schedule:
    - cron: '0 18 1 * *'  # 每天北京时间02:00执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fakeip_filter_rules:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install mihomo
        run: |
          set -euo pipefail

          base="https://github.com/MetaCubeX/mihomo/releases/download/Prerelease-Alpha"
          version="$(curl -fsSL --retry 3 "$base/version.txt" | tr -d '\r\n')"
          test -n "$version"

          curl -fsSL --retry 3 \
            "$base/mihomo-linux-amd64-${version}.gz" \
            -o "$RUNNER_TEMP/mihomo.gz"

          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          sudo install -m 0755 "$RUNNER_TEMP/mihomo" /usr/local/bin/mihomo

          mihomo -v

      - name: Fetch FakeIP-Filter Rules
        run: |
          set -euo pipefail

          mkdir -p rules/Domain

          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/Rcftngqmgq/ClashRules/refs/heads/main/rules/Domain/fakeipfilter-cn.list" \
            -o rules/Domain/fakeipfilter-cn.list

          test -s rules/Domain/fakeipfilter-cn.list

      - name: Convert FakeIP-Filter Rules to YAML
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          source = Path("rules/Domain/fakeipfilter-cn.list")
          target = Path("rules/Domain/fakeipfilter-cn.yaml")
          rules = set()

          for line in source.read_text(encoding="utf-8-sig").splitlines():
              # 清理注释、空白，保留原有通配符。
              rule = line.split("#", 1)[0].strip().lower()
              if rule:
                  rules.add(rule)

          if not rules:
              raise SystemExit("错误：没有有效规则，停止生成")

          payload = [
              "  - '" + rule.replace("'", "''") + "'"
              for rule in sorted(rules)
          ]

          target.write_text(
              "payload:\n" + "\n".join(payload) + "\n",
              encoding="utf-8",
          )

          print(f"已生成 YAML，共 {len(rules)} 条规则")
          PY

      - name: Convert FakeIP-Filter Rules to MRS
        run: |
          set -euo pipefail

          mihomo convert-ruleset domain yaml \
            rules/Domain/fakeipfilter-cn.yaml \
            rules/Domain/fakeipfilter-cn.mrs

          test -s rules/Domain/fakeipfilter-cn.mrs

      - name: Commit and Push Changes
        run: |
          set -euo pipefail

          git add -- \
            rules/Domain/fakeipfilter-cn.list \
            rules/Domain/fakeipfilter-cn.yaml \
            rules/Domain/fakeipfilter-cn.mrs

          if git diff --cached --quiet; then
            echo "文件没有变化，无需提交"
            exit 0
          fi

          git commit -m "Update FakeIP-Filter rules (list -> yaml -> mrs)"

          # 其他工作流可能同时提交，推送前先合并远端更新。
          git pull --rebase
          git push
